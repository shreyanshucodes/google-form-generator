<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Google Form Generator workflow</title>
  <desc id="desc">A public Google Form is inspected, transformed into coherent synthetic profiles, and exported as CSV and JSON for analysis.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#surface)"/>
  <path d="M0 315 C280 215 510 410 1200 250 V390 H0Z" fill="#0b1220" opacity=".7"/>
  <circle cx="1070" cy="45" r="155" fill="#38bdf8" opacity=".07"/>
  <circle cx="1140" cy="330" r="170" fill="#34d399" opacity=".06"/>
  <text x="64" y="78" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">Google Form Generator</text>
  <text x="64" y="116" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="18">From public schema to coherent synthetic data.</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="64" y="190" width="220" height="118" rx="16" fill="#172554" stroke="#38bdf8" stroke-width="2"/>
    <text x="174" y="234" fill="#f8fafc" font-size="20" font-weight="700">Inspect</text>
    <text x="174" y="264" fill="#bfdbfe" font-size="14">Map fields, options,</text>
    <text x="174" y="285" fill="#bfdbfe" font-size="14">sections, and answer IDs</text>
    <rect x="490" y="190" width="220" height="118" rx="16" fill="#12312c" stroke="#34d399" stroke-width="2"/>
    <text x="600" y="234" fill="#f8fafc" font-size="20" font-weight="700">Generate</text>
    <text x="600" y="264" fill="#bbf7d0" font-size="14">Build varied, coherent</text>
    <text x="600" y="285" fill="#bbf7d0" font-size="14">synthetic respondents</text>
    <rect x="916" y="190" width="220" height="118" rx="16" fill="#3b2411" stroke="#fb923c" stroke-width="2"/>
    <text x="1026" y="234" fill="#f8fafc" font-size="20" font-weight="700">Analyze</text>
    <text x="1026" y="264" fill="#fed7aa" font-size="14">Export CSV + JSON</text>
    <text x="1026" y="285" fill="#fed7aa" font-size="14">and inspect distributions</text>
  </g>
  <path d="M284 249 H490 M710 249 H916" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M470 238 L490 249 L470 260 M896 238 L916 249 L896 260" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="353" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">Local-first exports • reproducible seeds • profile-aware data</text>
</svg>
